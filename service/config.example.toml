# 复制到 ~/.config/dibao/config.toml（make install 在不存在时自动复制）。环境变量 DIBAO_* 优先。
[dibao]
port = 8766                 # 只绑 127.0.0.1
sync_down_secs = 60         # git pull --rebase home-data 的周期
push_debounce_secs = 60     # 本地提交后多久合并成一次 push
worker_timeout = 30         # apply_card 子进程硬超时（秒）
log_file = "~/Library/Logs/dibao/api.log"   # 1 MB × 3 轮转
